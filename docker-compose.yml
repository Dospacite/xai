services:
  app:
    build: .
    container_name: python_app
    depends_on:
      - mongo
    environment:
      - PYTHONUNBUFFERED=1
      - GITHUB_PAT=${GITHUB_PAT}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MAIN_PERIOD=${MAIN_PERIOD:-10}
      - FETCH_PERIOD=${FETCH_PERIOD:-10}
    volumes:
      - ./app:/app
      - ./data:/app/data
    command: python startup.py

    shm_size: 2g
    mem_limit: 6g
    cpus: 3

    restart: unless-stopped

  mongo:
    image: mongo:noble
    container_name: mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
