services:
  app:
    build: .
    container_name: python_app
    depends_on:
      - mongo
    environment:
      - PYTHONUNBUFFERED=1
      - GITHUB_PAT=${GITHUB_PAT}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MAIN_PERIOD=${MAIN_PERIOD:-10}
      - FETCH_PERIOD=${FETCH_PERIOD:-10}
    volumes:
      - ./app:/app
      - ./data:/app/data
    command: python startup.py --main-period ${MAIN_PERIOD:-10} --fetch-period ${FETCH_PERIOD:-10}

  mongo:
    image: mongo:noble
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
