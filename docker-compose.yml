services:
  app:
    build: .
    container_name: python_app
    networks:
      - xai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONUNBUFFERED: "1"
      GITHUB_PAT: ${GITHUB_PAT}
      MONGO_URI: ${MONGO_URI}
      MAIN_PERIOD: ${MAIN_PERIOD:-10}
      FETCH_PERIOD: ${FETCH_PERIOD:-10}
    volumes:
      - ./app:/app
      - ./data:/app/data
    command: python startup.py

    shm_size: 2g
    mem_limit: 6g
    cpus: 3

    restart: unless-stopped
networks:
  xai:
    external: true
